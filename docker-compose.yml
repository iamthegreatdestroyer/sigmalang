# =============================================================================
# ΣLANG Production Stack - Docker Compose
# Port Series: 26000-26999 (SigmaLang exclusive range)
# =============================================================================
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f sigmalang  # View API logs
#   docker compose down               # Stop all services
# =============================================================================

name: sigmalang

services:
  # ===========================================================================
  # ΣLANG API Server
  # ===========================================================================
  sigmalang:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ghcr.io/iamthegreatdestroyer/sigmalang:latest
    container_name: sigmalang-api
    restart: unless-stopped
    ports:
      # Loopback-only 2026-07-04 security review: no auth on this API (no
      # API key/JWT anywhere in source or this compose file), and 300 lines
      # of container logs showed zero non-localhost/non-Docker-internal
      # client IPs (only 127.0.0.1 and the sigmalang-network's own 172.22.x
      # addresses from the healthcheck/metrics scrape). The metrics-endpoint
      # comment below (Prometheus sidecar removal note) also assumes
      # localhost:26080 as the intended access pattern. Restore to
      # "26080:8000" if a real external/LAN consumer is confirmed.
      - "127.0.0.1:26080:8000"  # API (internal 8000 → external 26080, loopback-only)
    environment:
      # API Configuration
      SIGMALANG_API_HOST: "0.0.0.0"
      SIGMALANG_API_PORT: "8000"
      SIGMALANG_API_WORKERS: "4"
      SIGMALANG_DEBUG: "false"

      # Logging
      SIGMALANG_LOG_LEVEL: "INFO"
      SIGMALANG_LOG_FORMAT: "json"

      # Cache (Redis)
      SIGMALANG_CACHE_ENABLED: "true"
      SIGMALANG_CACHE_BACKEND: "redis"
      SIGMALANG_REDIS_URL: "redis://redis:6379/0"

      # Monitoring
      SIGMALANG_METRICS_ENABLED: "true"
      SIGMALANG_METRICS_PORT: "9090"

      # Rate Limiting
      SIGMALANG_RATE_LIMIT_ENABLED: "true"
      SIGMALANG_RATE_LIMIT_REQUESTS: "100"
      SIGMALANG_RATE_LIMIT_WINDOW: "60"

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      # NOTE: the production image (Dockerfile, `production`/`runtime` targets)
      # never installs curl, so a curl-based test can never succeed regardless
      # of app health (see Dockerfile's own HEALTHCHECK and docker-compose.personal.yml
      # for the same precedent). Use the Python urllib one-liner instead, which is
      # already present in every stage since it's stdlib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    networks:
      - sigmalang-network

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: sigmalang-redis
    restart: unless-stopped
    ports:
      # Loopback-only 2026-07-04 security review: no requirepass configured
      # (see command: below) and its only consumer is sigmalang-api over
      # Docker-internal DNS (redis://redis:6379/0) — the external port
      # mapping serves no documented purpose. Restore to "26500:6379" if a
      # real external/LAN consumer is confirmed.
      - "127.0.0.1:26500:6379"  # Redis (internal 6379 → external 26500, loopback-only)
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sigmalang-network

  # ===========================================================================
  # Prometheus Metrics — DISABLED 2026-07-04 (redundant sidecar cleanup)
  # ===========================================================================
  # Removed as a duplicate of the box-wide Prometheus (systemd service on
  # port 9090, config at /etc/prometheus/prometheus.yml). This sidecar was
  # NOT scraping identical targets — it uniquely scraped sigmalang's own
  # /metrics endpoint (job "sigmalang", target sigmalang:8000) which the
  # box-wide instance did not cover. However, that endpoint is reachable
  # from the host at localhost:26080/metrics, so rather than run a whole
  # second Prometheus+Grafana+isolated-network stack (~187MB) for one
  # scrape target, the fix is to add a "sigmalang" job to the box-wide
  # Prometheus config (/etc/prometheus/prometheus.yml) pointing at
  # localhost:26080/metrics. See ecosystem review notes, Move 5a sibling
  # task. Re-enable this block instead if that wiring is ever reverted.
  # prometheus:
  #   image: prom/prometheus:v2.47.0
  #   container_name: sigmalang-prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "26900:9090"  # Prometheus (internal 9090 → external 26900)
  #   command:
  #     - "--config.file=/etc/prometheus/prometheus.yml"
  #     - "--storage.tsdb.path=/prometheus"
  #     - "--storage.tsdb.retention.time=15d"
  #     - "--web.enable-lifecycle"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus-data:/prometheus
  #   depends_on:
  #     - sigmalang
  #   networks:
  #     - sigmalang-network

  # ===========================================================================
  # Grafana Dashboards — DISABLED 2026-07-04 (redundant sidecar cleanup)
  # ===========================================================================
  # Removed alongside prometheus above. Verified before removal: zero
  # dashboard JSON files were ever provisioned (the dashboards provider
  # pointed at an empty directory), so no unique visualizations existed
  # here. Its only datasource was its own sigmalang-prometheus sidecar,
  # which is also disabled above. Nothing unique is lost by disabling this.
  # grafana:
  #   image: grafana/grafana:10.2.0
  #   container_name: sigmalang-grafana
  #   restart: unless-stopped
  #   ports:
  #     - "26910:3000"  # Grafana (internal 3000 → external 26910)
  #   environment:
  #     GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
  #     GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
  #     GF_USERS_ALLOW_SIGN_UP: "false"
  #     GF_SERVER_ROOT_URL: "http://localhost:26910"
  #   volumes:
  #     - grafana-data:/var/lib/grafana
  #     - ./grafana/provisioning:/etc/grafana/provisioning:ro
  #   depends_on:
  #     - prometheus
  #   networks:
  #     - sigmalang-network

# =============================================================================
# Networks
# =============================================================================
networks:
  sigmalang-network:
    driver: bridge
    name: sigmalang-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data:
    name: sigmalang-redis-data
  # Unused while prometheus/grafana services above are disabled (2026-07-04).
  # prometheus-data:
  #   name: sigmalang-prometheus-data
  # grafana-data:
  #   name: sigmalang-grafana-data
