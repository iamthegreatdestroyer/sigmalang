name: Benchmarks

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: benchmark-${{ github.ref }}
    cancel-in-progress: true

jobs:
    benchmark:
        name: Run pytest benchmarks
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install numpy pytest pytest-cov pytest-asyncio pytest-timeout pytest-benchmark hypothesis httpx
                  pip install -e ".[dev]"

            - name: Run benchmarks
              run: |
                  pytest --benchmark-only \
                         --benchmark-json=benchmark.json \
                         --benchmark-warmup=on \
                         --benchmark-disable-gc \
                         -q || true

            - name: Upload benchmark results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: benchmark-results-${{ github.sha }}
                  path: benchmark.json
                  retention-days: 90

            # The comparison reads stored baseline results from the gh-pages branch.
            # That branch does not exist yet, so skip the comparison until it does
            # instead of failing every pull request.
            - name: Check for gh-pages baseline branch
              id: baseline
              run: |
                  if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::No gh-pages branch: benchmark baseline comparison skipped"
                  fi

            - name: Compare to baseline (PR only)
              if: github.event_name == 'pull_request' && steps.baseline.outputs.exists == 'true'
              uses: benchmark-action/github-action-benchmark@v1
              with:
                  tool: "pytest"
                  output-file-path: benchmark.json
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  auto-push: false
                  comment-on-alert: true
                  alert-threshold: "150%"
                  fail-on-alert: false
                  summary-always: true
